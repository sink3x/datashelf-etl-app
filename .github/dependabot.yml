version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ['@types/*', 'eslint*', '@typescript-eslint/*', 'prettier', 'vitest', 'typescript']
    open-pull-requests-limit: 5
    target-branch: develop

  - package-ecosystem: uv
    directory: /services/etl
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: docker
    directories: ['/apps/api', '/apps/web', '/services/etl']
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop

  - package-ecosystem: terraform
    directories: ['/infra/terraform/envs/dev', '/infra/terraform/bootstrap']
    schedule:
      interval: monthly
    target-branch: develop
