name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: datashelf-api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: datashelf-web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: datashelf-etl
            context: services/etl
            dockerfile: services/etl/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/datashelf-api:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/datashelf-web:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/datashelf-etl:${{ github.ref_name }}`

            Full changelog: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
