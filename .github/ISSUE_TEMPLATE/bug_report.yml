name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, etl, infra, ci]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
